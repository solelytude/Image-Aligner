<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Aligner 2.2</title>
<style>
:root {
  color-scheme: dark;
  --bg:#17191d; --panel:#202329; --panel2:#292d34;
  --border:#393e47; --text:#e8eaf0; --muted:#9299a6;
  --accent:#79a9ff; --active:#304565;
}
* { box-sizing:border-box; }
html { min-height:100%; background:var(--bg); }
body {
  margin:0; padding:20px 12px; color:var(--text); background:var(--bg);
  font:13px/1.45 "Segoe UI",Arial,sans-serif;
}
button,input { font:inherit; }
button { color:inherit; cursor:pointer; }
button:focus-visible,.drop-zone:focus-visible,.layers-drop:focus-visible {
  outline:2px solid var(--accent); outline-offset:2px;
}
.app { width:100%; max-width:600px; margin:0 auto; }
header { display:flex; align-items:center; justify-content:space-between; margin:0 0 14px; }
h1 { margin:0; font-size:20px; font-weight:650; letter-spacing:-.4px; }
.subtitle { color:var(--muted); font-size:11px; margin-top:3px; }
.workspace {
  display:grid; grid-template-columns:minmax(0,1.533fr) minmax(0,.85fr);
  gap:8px; align-items:start;
}
.panel {
  min-width:0; background:var(--panel); border:1px solid var(--border);
  border-radius:9px; padding:7px;
}
.panel.drag-over { border-color:var(--accent); }
.panel-heading {
  display:flex; flex-direction:column; align-items:stretch; gap:6px;
  min-height:0; margin-bottom:8px;
}
.layer-control-row {
  display:flex; align-items:center; justify-content:space-between; gap:6px; min-width:0;
}
.layer-control-row.top-row { justify-content:space-between; }
.layer-control-row.brush-row { justify-content:space-between; }
.layer-control-row.tool-row { justify-content:flex-start; gap:7px; }
.layer-control-row .save-button { order:0; margin-left:auto; }
.layer-control-row .brush-settings { order:0; flex:1 1 auto; justify-content:space-between; gap:6px; }
.layer-control-row .target-controls { order:0; }
.global-layer-tools { display:flex; align-items:center; justify-content:flex-start; gap:7px; min-width:0; }
.global-layer-tools .opacity-control { margin-right:1px; }
.layer-active-check {
  appearance:none; -webkit-appearance:none; display:block; width:12px; height:12px;
  margin:0; border:1px solid #6d7583; border-radius:3px; background:#191c21;
  cursor:pointer; flex:0 0 12px; position:relative;
}
.layer-active-check:checked { background:#304565; border-color:#79a9ff; }
.layer-active-check:checked::after {
  content:""; position:absolute; left:3px; top:0px; width:3px; height:7px;
  border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg);
}
.layer-active-check:focus-visible { outline:1px solid var(--accent); outline-offset:2px; }
.layer-actions { flex-direction:column; gap:1px; }
.layer-row.active-tool-layer { border-color:#648bc3; background:#202733; }
.global-layer-tools .eraser-toggle:disabled,
.global-layer-tools .opacity-input:disabled,
.global-layer-tools .opacity-icon.disabled,
.global-layer-tools .liquify-toggle:disabled { opacity:.35; cursor:not-allowed; }
.brush-setting.pressure-disabled { opacity:.35; }
.brush-setting.pressure-disabled .brush-icon-pressure { cursor:not-allowed; pointer-events:none; }
.brush-value:disabled { opacity:.35; cursor:not-allowed; }
.small-button,.save-button {
  display:inline-flex; align-items:center; justify-content:center; gap:5px;
  min-height:28px; padding:4px 8px; border:1px solid var(--border);
  border-radius:6px; background:var(--panel2); white-space:nowrap; font-size:11px;
}
.small-button:hover { background:#343a44; }
.save-button {
  order:2; flex:0 0 auto; background:#d5e4ff; color:#18253a;
  border-color:#d5e4ff; font-weight:650;
}
.save-button:hover:not(:disabled) { background:#bcd4ff; }
.save-button:disabled { opacity:.4; cursor:not-allowed; }
.drop-zone {
  position:relative; display:flex; align-items:center; justify-content:center;
  overflow:hidden; border:1px dashed #505763; border-radius:7px; background:#191c21;
}
#backgroundZone { width:100%; aspect-ratio:3/4; min-height:220px; max-height:530px; }
.drop-zone.drag-over { border-color:var(--accent); background:#222c3b; }
#previewCanvas {
  display:none; width:100%; height:100%; object-fit:contain;
  touch-action:none;
}
#previewCanvas.eraser-cursor { cursor:none; }
.empty-state {
  display:flex; flex-direction:column; align-items:center; gap:9px;
  padding:12px; text-align:center; color:var(--muted); font-size:11px;
}
.empty-icon { font-size:30px; line-height:1; opacity:.75; }
.background-name-row {
  display:flex; align-items:center; gap:4px; min-width:0; margin-top:7px;
}
#backgroundName {
  flex:1; min-width:0; min-height:16px; margin:0; overflow:hidden;
  color:var(--muted); font-size:10px; text-overflow:ellipsis; white-space:nowrap;
}
#removeBackground {
  display:none; flex:0 0 19px; width:19px; height:19px; align-items:center;
  justify-content:center; padding:0; border:1px solid #414752; border-radius:4px;
  background:#242830; color:#d99a9a; font-size:15px; line-height:1;
}
#removeBackground:hover { background:#482b30; color:#ffaaaa; }
.counter { color:var(--muted); font-size:10px; margin:0 0 5px; }
.layer-list {
  display:flex; flex-direction:column; gap:4px; max-height:472px;
  overflow-y:auto; padding-right:1px;
}
.layer-row {
  display:grid; grid-template-columns:20px 58px minmax(0,1fr);
  gap:3px; align-items:center; min-width:0; min-height:75px;
  padding:4px 3px; border:1px solid transparent; border-radius:6px; background:#191c21;
}
.layer-row.hidden-layer { opacity:.48; }
.layer-row.selected-layer { border-color:#648bc3; }
.layer-actions {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:1px; width:20px;
}
.eye-button,.delete-button {
  display:flex; align-items:center; justify-content:center;
  width:20px; height:20px; padding:0; border:0; border-radius:4px; background:transparent;
}
.eye-button { color:#c5cad4; font-size:14px; }
.eye-button:hover { background:var(--panel2); }
.delete-button { color:#d17b7b; font-size:16px; line-height:1; }
.delete-button:hover { background:#482b30; color:#ffaaaa; }
.thumb {
  display:block; width:58px; height:54px; padding:0; overflow:hidden;
  border:1px solid #3c424c; border-radius:4px; background-color:#252932;
  background-image:linear-gradient(45deg,#30343d 25%,transparent 25%),
    linear-gradient(-45deg,#30343d 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#30343d 75%),
    linear-gradient(-45deg,transparent 75%,#30343d 75%);
  background-size:12px 12px; background-position:0 0,0 6px,6px -6px,-6px 0;
}
.thumb img { display:block; width:100%; height:100%; object-fit:contain; }
.layer-tools {
  min-width:0; display:flex; flex-direction:row; align-items:center;
  justify-content:flex-start; gap:9px;
}
.corner-controls {
  display:grid; grid-template-columns:22px 22px; grid-template-rows:21px 21px;
  grid-template-areas:"tl tr" "bl br"; gap:0; justify-content:start;
  align-content:center; flex:0 0 auto; min-width:0;
}
.corner-button {
  display:flex; align-items:center; justify-content:center; width:22px; height:21px;
  padding:0; border:1px solid transparent; border-radius:4px;
  background:transparent; color:#aab2c0; font-size:16px; line-height:1;
}
.corner-button[data-corner="tr"] { grid-area:tr; }
.corner-button[data-corner="tl"] { grid-area:tl; }
.corner-button[data-corner="br"] { grid-area:br; }
.corner-button[data-corner="bl"] { grid-area:bl; }
.corner-button:hover { background:#343a44; }
.corner-button.selected { background:var(--active); border-color:#648bc3; color:#fff; }
.layer-side-controls {
  display:flex; flex:0 1 auto; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; min-width:0;
}
.opacity-control {
  display:flex; flex-direction:row; align-items:center;
  justify-content:center; gap:2px; width:max-content; max-width:100%;
}
.opacity-icon {
  display:block; flex:0 0 11px; width:11px; height:11px; overflow:hidden;
  border:1px solid #a9b0bd; border-radius:50%;
  background-color:#343943;
  background-image:repeating-conic-gradient(#c9cfda 0% 25%,#343943 0% 50%);
  background-size:6px 6px;
  cursor:ew-resize; touch-action:none; user-select:none;
}
.opacity-input {
  display:block; flex:0 0 3ch; width:3ch; min-width:0; height:21px; padding:1px 0;
  border:1px solid #414752; border-radius:4px; outline:none;
  background:#242830; color:var(--text); font-size:10px; text-align:center;
  appearance:textfield; -moz-appearance:textfield;
}
.opacity-input::-webkit-inner-spin-button,.opacity-input::-webkit-outer-spin-button {
  -webkit-appearance:none; margin:0;
}
.opacity-input:focus,.brush-value:focus { border-color:var(--accent); }
.eraser-toggle {
  display:flex; align-items:center; justify-content:center;
  flex:0 0 23px; width:23px; min-width:23px; height:22px; padding:0;
  border:1px solid #414752; border-radius:4px;
  background:#242830; color:#c6ccd7; font-size:13px;
}
.eraser-toggle:hover { background:#343a44; }
.eraser-toggle.active { background:#513b28; border-color:#d6a15e; color:#ffe0ae; }
.brush-settings {
  order:1; display:flex; align-items:center; justify-content:flex-end;
  gap:8px; min-width:0; flex:0 1 auto;
}
.brush-setting {
  display:flex; align-items:center; justify-content:center; flex:0 0 13px;
  width:13px; height:24px; position:relative; cursor:default;
}
.brush-input {
  position:absolute; inset:0; width:100%; height:100%; opacity:0;
  pointer-events:none;
}
.brush-icon-size {
  display:block; width:12px; height:12px; border:1.5px solid #d9deea;
  border-radius:50%; flex:none; cursor:ew-resize; touch-action:none; user-select:none;
}
.brush-icon-hardness {
  display:block; width:13px; height:13px; border-radius:50%; flex:none;
  background:radial-gradient(circle,#e7ebf3 0%,rgba(231,235,243,.72) 38%,rgba(231,235,243,0) 72%);
  cursor:ew-resize; touch-action:none; user-select:none;
}
.brush-setting:focus-within { outline:1px solid var(--accent); border-radius:4px; }
.brush-value {
  flex:0 0 29px; width:29px; min-width:29px; height:24px; padding:2px 1px;
  border:1px solid var(--border); border-radius:4px; outline:none;
  background:#191c21; color:var(--text); font-size:10px; text-align:center;
  appearance:textfield; -moz-appearance:textfield;
}
.brush-value::-webkit-inner-spin-button,.brush-value::-webkit-outer-spin-button {
  -webkit-appearance:none; margin:0;
}
.target-controls { display:flex; align-items:center; gap:2px; flex:0 0 auto; }
.target-button {
  min-width:25px; height:24px; padding:2px 5px; border:1px solid var(--border);
  border-radius:4px; background:#191c21; color:var(--muted); font-size:9px;
}
.target-button.active { background:var(--active); border-color:#648bc3; color:#fff; }
.brush-icon-pressure {
  display:block; width:12px; height:12px; border-radius:50%; flex:none;
  background:#e7ebf3; border:2px solid #e7ebf3;
  box-shadow:inset 0 0 0 2px #292d34;
  cursor:ew-resize; touch-action:none; user-select:none;
}
.liquify-tools { display:flex; flex-direction:column; align-items:center; gap:3px; }
.liquify-toggle {
  display:flex; align-items:center; justify-content:center; width:23px; height:22px;
  padding:0; border:1px solid #414752; border-radius:4px; background:#242830;
  color:#c6ccd7; font-size:16px; line-height:1;
}
